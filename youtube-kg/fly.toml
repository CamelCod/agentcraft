# Fly.io deployment for YouTube Creator Knowledge Graph
app = "hello-fly-rosy-cloud-6603"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "production"
  SECRET_KEY = "fly-prod-key-change-me"
  LLM_PROVIDER = "anthropic"
  CORS_ORIGINS = "https://home.agentcraftconsultancy.com"

[deploy]
  strategy = "rolling"

[[services]]
  protocol = "tcp"
  internal_port = 8000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.http_checks]
    enabled = true
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 2048
