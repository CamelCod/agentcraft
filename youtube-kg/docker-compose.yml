version: "3.9"

x-common-env: &common-env
  env_file: .env
  restart: unless-stopped

x-backend-depends: &backend-depends
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    neo4j:
      condition: service_healthy
    qdrant:
      condition: service_started
    minio:
      condition: service_healthy

services:
  # ─── Reverse Proxy ───────────────────────────────────────────────────────
  nginx:
    <<: *common-env
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - frontend
    networks:
      - public
      - internal

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend:
    <<: *common-env
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    networks:
      - internal

  # ─── API Gateway (FastAPI) ───────────────────────────────────────────────
  api:
    <<: [*common-env, *backend-depends]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    volumes:
      - ./backend:/app
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Celery Worker ───────────────────────────────────────────────────────
  worker:
    <<: [*common-env, *backend-depends]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} -Q default,discovery,ingestion,extraction,verification,reporting
    volumes:
      - ./backend:/app
    networks:
      - internal

  # ─── Celery Beat (Scheduler) ─────────────────────────────────────────────
  beat:
    <<: [*common-env, *backend-depends]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A app.workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler
    volumes:
      - ./backend:/app
      - celery-beat-data:/var/run/celery
    networks:
      - internal

  # ─── Flower (Celery Monitor) ─────────────────────────────────────────────
  flower:
    <<: [*common-env, *backend-depends]
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    command: celery -A app.workers.celery_app flower --port=5555
    networks:
      - internal

  # ─── Whisper Transcription Service ───────────────────────────────────────
  whisper:
    <<: *common-env
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
    networks:
      - internal

  # ─── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    <<: *common-env
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Neo4j ───────────────────────────────────────────────────────────────
  neo4j:
    <<: *common-env
    env_file: []
    restart: unless-stopped
    image: neo4j:5.26-community
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=2G
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "-q", "http://localhost:7474"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ─── Qdrant (Vector DB) ──────────────────────────────────────────────────
  qdrant:
    <<: *common-env
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - internal

  # ─── Redis ───────────────────────────────────────────────────────────────
  redis:
    <<: *common-env
    image: redis:7.4-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (Object Storage) ──────────────────────────────────────────────
  minio:
    <<: *common-env
    image: minio/minio:RELEASE.2025-05-24T17-08-30Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── MinIO Init (create buckets) ─────────────────────────────────────────
  minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    depends_on:
      minio:
        condition: service_healthy
    env_file: .env
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY;
      mc mb --ignore-existing local/$$MINIO_BUCKET_RAW;
      mc mb --ignore-existing local/$$MINIO_BUCKET_TRANSCRIPTS;
      mc mb --ignore-existing local/$$MINIO_BUCKET_REPORTS;
      exit 0;
      "
    networks:
      - internal

  # ─── Prometheus ──────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - internal

  # ─── Grafana ─────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:12.0.1
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${FIRST_SUPERUSER_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - internal

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  neo4j-data:
  neo4j-logs:
  qdrant-data:
  redis-data:
  minio-data:
  celery-beat-data:
  prometheus-data:
  grafana-data:
